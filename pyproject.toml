[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-eval-stack"
version = "0.1.0"
description = "3-layer LLM evaluation stack – FAQ Knowledge Base Bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
run-evals = "run_evals:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ANTHROPIC_API_KEY (deselect with -m 'not integration')",
]
